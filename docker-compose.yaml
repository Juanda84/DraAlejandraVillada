services:
  web-alejandra-villada:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web-alejandra-villada
    restart: unless-stopped
    expose:
      - "80"
    ports:
      - "${PORT:-80}:80"
    environment:
      - NODE_ENV=production
      - TZ=America/Bogota
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
