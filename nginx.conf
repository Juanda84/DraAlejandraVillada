server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión Gzip para rendimiento óptimo
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        image/svg+xml;

    # Cabeceras de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Endpoint de Healthcheck para Coolify / Docker
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK";
    }

    # Imágenes y fuentes: cambian poco, caché larga de 30 días
    location ~* ^/assets/.+\.(?:png|jpe?g|webp|gif|svg|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # CSS/JS: cambian seguido durante desarrollo activo, siempre revalidar con el servidor
    # (sin "expires" el navegador manda ETag/If-Modified-Since y nginx responde 304 si no cambió,
    # así que sigue siendo rápido pero nunca sirve una versión vieja desde la caché local)
    location ~* ^/assets/.+\.(?:css|js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Resto de /assets/ (por si se agregan otros tipos de archivo)
    location /assets/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Ruta principal
    location / {
        try_files $uri $uri/ /index.html;
    }
}
