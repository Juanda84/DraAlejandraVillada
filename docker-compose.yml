# Despliegue de Dra. Alejandra Villada en Coolify (Git + Docker Compose).
# Configura el dominio desde el panel de Coolify para frontend, puerto INTERNO 3000.
# No publicamos un puerto del VPS: Coolify actúa como proxy HTTPS.
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* debe existir en tiempo de compilación en Next.js.
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-573116445913}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-573116445913}
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      # Node 22 proporciona fetch; no requiere curl ni wget en la imagen final.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
